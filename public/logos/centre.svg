<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" fill="none">
  <!-- Outer Ring Dark Blue & Green Speed Dash Icon -->
  <g transform="translate(150, 95)">
    <!-- Main Big Arc Ring -->
    <circle cx="0" cy="0" r="58" stroke="#00213B" stroke-width="26" fill="none" stroke-dasharray="290 80" stroke-dashoffset="40" stroke-linecap="round" />
    
    <!-- Bright Green Inner Glow Ring -->
    <circle cx="0" cy="0" r="32" stroke="#68C700" stroke-width="14" fill="none" />

    <!-- Motion Speed Streaks to the right -->
    <rect x="52" y="-34" width="30" height="7" rx="3.5" fill="#38C676" />
    <rect x="52" y="-22" width="22" height="7" rx="3.5" fill="#38C676" />
    <rect x="52" y="-10" width="40" height="7" rx="3.5" fill="#38C676" />
    <rect x="52" y="2" width="26" height="7" rx="3.5" fill="#44D355" />
    <rect x="52" y="14" width="36" height="7" rx="3.5" fill="#5CE529" />
    <rect x="52" y="26" width="18" height="7" rx="3.5" fill="#68C700" />
    <circle cx="98" cy="-10" r="5" fill="#5CE529" />
    <circle cx="82" cy="2" r="4.5" fill="#68C700" />
  </g>

  <!-- THE CENTRE Text -->
  <text x="150" y="196" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" letter-spacing="4" fill="#00213B">THE</text>
  <text x="150" y="232" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#00213B">CENTRE</text>
  
  <!-- Sub-label -->
  <text x="150" y="250" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.5" fill="#00213B">Center for Empowerment, Innovation, and</text>
  <text x="150" y="262" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.5" fill="#00213B">Training on Renewable Energy</text>
</svg>
