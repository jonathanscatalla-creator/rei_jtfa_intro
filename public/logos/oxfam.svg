    <g transform="translate(195, 30)">
      <!-- OXFAM Bold -->
      <text x="0" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="78" fill="#3D7D1E" letter-spacing="1">OXFAM</text>
      <!-- Pilipinas -->
